  <style>
    * {

      font-family: "Tiro Bangla", serif;

    .tiro-bangla-regular {
      font-family: "Tiro Bangla", serif;
      font-weight: 400;
      font-style: normal;
    }

    .tiro-bangla-regular-italic {
      font-family: "Tiro Bangla", serif;
      font-weight: 400;
      font-style: italic;
    }

    .app-shell {
      max-width: 520px;
    }

    .class-card {
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .class-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(30, 64, 110, .09);
    }

    .class-card:active {
      transform: scale(.98);
    }

    .class-card:focus-visible,
    button:focus-visible {
      outline: 3px solid #3989e9;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>
