<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>JSON Editor — গণিত বন্ধু</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- MathJax: অ্যাপের সমাধান পেজের মতোই, তাই প্রিভিউ হুবহু একই দেখাবে -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      chtml: { scale: 1.05, displayAlign: 'left', displayIndent: '0' }
    };
  </script>
  <script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.js"></script>

  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { bengali: ['Tiro Bangla', 'serif'], english: ['Inter', 'sans-serif'] } } }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: "Tiro Bangla", serif; background: #f4f7fd; color: #123d7d; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid #3989e9; outline-offset: 2px;
    }

    /* ---------- হেডার ---------- */
    #top { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-bottom: 1px solid #dfe8f6; }
    .hbtn {
      display: inline-flex; align-items: center; gap: 6px; padding: 9px 12px; border-radius: 999px;
      background: #eef4fd; color: #1554a4; font: 600 13px Inter, sans-serif; border: 1px solid #d7e4f7; white-space: nowrap;
    }
    .hbtn:hover { background: #e2edfc; }
    .hbtn.primary { background: #1565c9; color: #fff; border-color: #1565c9; }
    .hbtn.primary:hover { background: #0f54ad; }

    /* ---------- ফর্ম ---------- */
    .fld {
      width: 100%; border: 1.5px solid #d7e4f7; background: #fff; border-radius: 12px; padding: 10px 12px;
      font-size: 17px; line-height: 1.5; color: #14305c; resize: none; display: block;
      font-family: "Tiro Bangla", "Inter", serif;
    }
    .fld:focus { outline: none; border-color: #2f80e8; box-shadow: 0 0 0 3px rgba(47,128,232,.18); }
    .fld.mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 15px; }
    .fld.sm { width: auto; min-width: 0; padding: 7px 10px; font-size: 16px; }
    .lbl { display: block; margin: 12px 0 5px; font: 600 12px Inter, sans-serif; color: #637895; letter-spacing: .03em; text-transform: uppercase; }
    .lbl i { font-style: normal; text-transform: none; font-weight: 400; }
    .prev { margin-top: 6px; padding: 8px 12px; border-radius: 10px; background: #f1f6fe; font-size: 17px; line-height: 1.8; color: #14305c; overflow-x: auto; }
    .prev:empty { display: none; }

    .card { background: #fff; border: 1px solid #e3ebf8; border-radius: 18px; padding: 14px; box-shadow: 0 2px 10px rgba(30,64,110,.04); }
    .qcard { background: #fff; border: 1.5px solid #e3ebf8; border-radius: 20px; padding: 14px; margin-top: 16px; box-shadow: 0 2px 10px rgba(30,64,110,.04); }
    .qcard.active { border-color: #2f80e8; box-shadow: 0 0 0 3px rgba(47,128,232,.12); }
    .qhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .qbadge { display: inline-flex; align-items: center; justify-content: center; min-width: 52px; height: 36px; padding: 0 12px; border-radius: 999px; background: #2f80e8; color: #fff; font: 600 15px Inter, sans-serif; }
    .qhead .fld.sm { width: 92px; }
    .grow { flex: 1 1 auto; }
    .ibtn { width: 34px; height: 34px; border-radius: 10px; background: #eef4fd; color: #1554a4; border: 1px solid #d7e4f7; font-size: 13px; }
    .ibtn:hover { background: #e2edfc; }
    .ibtn.del { color: #d6455d; }
    .atitle { margin: 18px 0 4px; font: 700 15px Inter, sans-serif; color: #0f2a5c; display: flex; align-items: center; gap: 8px; }
    .atitle::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #2fb36d; }
    .line { margin-top: 10px; padding: 10px; border-radius: 14px; background: #f7faff; border: 1px solid #e3ebf8; }
    .lhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .lnum { width: 26px; height: 26px; border-radius: 50%; background: #e3eefd; color: #1565c9; font: 600 12px Inter, sans-serif; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .seg { display: inline-flex; background: #e3ebf8; border-radius: 999px; padding: 3px; }
    .seg button { padding: 4px 11px; border-radius: 999px; font: 500 12px Inter, sans-serif; color: #4a6285; }
    .seg button[aria-pressed="true"] { background: #1565c9; color: #fff; }
    .addline { margin-top: 12px; width: 100%; padding: 10px; border-radius: 12px; border: 1.5px dashed #b9cdeb; color: #1554a4; font: 600 14px Inter, sans-serif; background: transparent; }
    .addline:hover { background: #eef4fd; }
    details.more { margin-top: 12px; }
    details.more summary { font: 500 13px Inter, sans-serif; color: #637895; cursor: pointer; }
    details.more textarea { margin-top: 8px; }
    .imgrow { display: grid; gap: 8px; }

    /* ---------- কীবোর্ড ---------- */
    #kb {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #e9eef7; border-top: 1px solid #cfdaec;
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; touch-action: manipulation;
    }
    #kb[hidden], #kb-open[hidden] { display: none; }
    .kb-inner { max-width: 760px; margin: 0 auto; }
    .kb-top { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .kb-seg { display: flex; flex: 1; background: #d5e0f2; border-radius: 10px; padding: 3px; }
    .kb-seg button { flex: 1; padding: 6px 0; border-radius: 8px; font: 600 14px Inter, sans-serif; color: #4a6285; }
    .kb-seg button[aria-pressed="true"] { background: #fff; color: #1565c9; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    .kb-icon { width: 40px; height: 34px; border-radius: 9px; background: #d5e0f2; color: #1554a4; font-size: 15px; }
    .kb-icon[aria-pressed="true"] { background: #1565c9; color: #fff; }
    .ktabs { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 5px; scrollbar-width: none; }
    .ktabs::-webkit-scrollbar { display: none; }
    .ktabs button { flex: 0 0 auto; padding: 5px 13px; border-radius: 8px; background: #d5e0f2; font: 600 13px Inter, sans-serif; color: #4a6285; }
    .ktabs button[aria-pressed="true"] { background: #1565c9; color: #fff; }
    .krow { display: flex; gap: 4px; margin-bottom: 4px; }
    .key {
      flex: 1 1 0; min-width: 0; height: clamp(34px, 5.3vh, 44px); border-radius: 8px; background: #fff; border-bottom: 2px solid #c5d3ea;
      font: 400 18px "Tiro Bangla", "Inter", serif; color: #14305c; display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .key:active { background: #dbe8fb; }
    .key.fn { background: #c9d8f0; color: #1554a4; font: 600 14px Inter, sans-serif; }
    .key.on { background: #1565c9; color: #fff; }
    .key.w2 { flex: 2 1 0; } .key.w3 { flex: 3 1 0; } .key.w4 { flex: 4 1 0; }
    .key .tiny { font: 600 11px Inter, sans-serif; }
    .kfrac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.05; font-size: 13px; }
    .kfrac i { font-style: normal; padding: 0 3px; }
    .kfrac i:first-child { border-bottom: 1.5px solid currentColor; }
    .ksq { display: inline-flex; align-items: flex-start; }
    .ksq i { font-style: normal; border-top: 1.5px solid currentColor; margin-left: 1px; padding: 0 2px; }
    #kb-open { position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 41; width: 52px; height: 52px; border-radius: 50%; background: #1565c9; color: #fff; font-size: 20px; box-shadow: 0 6px 18px rgba(21,101,201,.4); }

    /* ---------- মোডাল ---------- */
    #modal { position: fixed; inset: 0; z-index: 60; background: rgba(10,22,44,.55); display: flex; align-items: flex-end; justify-content: center; }
    #modal[hidden] { display: none; }
    .sheet { width: 100%; max-width: 760px; max-height: 92vh; background: #fff; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; overflow: hidden; }
    .sheet header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid #e3ebf8; }
    .sheet h2 { font: 700 17px Inter, sans-serif; color: #0f2a5c; flex: 1; }
    .sheet .body { padding: 12px 16px 16px; overflow: auto; }
    #json-out { width: 100%; height: 46vh; border: 1.5px solid #d7e4f7; border-radius: 12px; padding: 10px 12px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #14305c; background: #f7faff; resize: vertical; }
    .warn { margin-bottom: 10px; padding: 10px 12px; border-radius: 12px; background: #fff6e5; border: 1px solid #f5d9a3; color: #8a5a00; font: 13px/1.6 Inter, sans-serif; }
    .ok { margin-bottom: 10px; padding: 10px 12px; border-radius: 12px; background: #e9f8ef; border: 1px solid #cfeedd; color: #14754d; font: 13px/1.6 Inter, sans-serif; }
    .err { margin-top: 8px; color: #d6455d; font: 13px Inter, sans-serif; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>

<body>

  <!-- ===== হেডার ===== -->
  <header id="top">
    <div class="mx-auto flex max-w-[760px] items-center gap-2 px-3 py-2">
      <button type="button" id="btn-new-q" class="hbtn"><i class="fa-solid fa-plus"></i> New Question</button>
      <button type="button" id="btn-new-a" class="hbtn"><i class="fa-solid fa-plus"></i> New Answer</button>
      <button type="button" id="btn-json" class="hbtn primary ml-auto"><i class="fa-solid fa-code"></i> Generate JSON</button>
    </div>
  </header>

  <main id="main" class="mx-auto max-w-[760px] px-3 pt-3">

    <!-- ===== ফাইলের তথ্য (meta) ===== -->
    <details id="meta-box" class="card" open>
      <summary class="cursor-pointer font-english text-[14px] font-semibold text-[#0f2a5c]">Exercise info (meta)</summary>
      <div id="meta" class="mt-3 grid grid-cols-2 gap-3">
        <div><label class="lbl" style="margin-top:0">Class</label><input class="fld kt" inputmode="none" data-meta="classNo" data-mode="plain" autocomplete="off" placeholder="9"></div>
        <div><label class="lbl" style="margin-top:0">Chapter no.</label><input class="fld kt" inputmode="none" data-meta="chapterNo" data-mode="plain" autocomplete="off" placeholder="1"></div>
        <div class="col-span-2"><label class="lbl" style="margin-top:0">Chapter title</label><input class="fld kt" inputmode="none" data-meta="chapterTitle" data-mode="plain" autocomplete="off" placeholder="বাস্তব সংখ্যা"></div>
        <div class="col-span-2"><label class="lbl" style="margin-top:0">Exercise <i>(ফাইলের নাম হবে এটাই, যেমন 1.2 → 1.2.json)</i></label><input class="fld kt" inputmode="none" data-meta="exercise" data-mode="plain" autocomplete="off" placeholder="1.2"></div>
      </div>
      <button type="button" id="btn-reset" class="mt-3 font-english text-[12px] text-[#d6455d] underline">Clear everything and start over</button>
    </details>

    <div id="questions"></div>

    <p class="mx-auto mt-6 max-w-[520px] text-center font-english text-[12px] leading-relaxed text-[#8a9bb4]">
      লেখা আপনা-আপনি এই ব্রাউজারে সেভ হয়ে থাকে। কাজ শেষ হলে <b>Generate JSON</b> চাপুন।
    </p>
  </main>

  <!-- ===== কাস্টম কীবোর্ড ===== -->
  <div id="kb">
    <div class="kb-inner">
      <div class="kb-top">
        <div class="kb-seg" role="group" aria-label="Keyboard">
          <button type="button" data-kb="normal" aria-pressed="true">সাধারণ</button>
          <button type="button" data-kb="math" aria-pressed="false">Math</button>
        </div>
        <button type="button" id="kb-sys" class="kb-icon" aria-pressed="false" title="ফোনের নিজের কীবোর্ড ব্যবহার করুন" aria-label="System keyboard"><i class="fa-regular fa-keyboard"></i></button>
        <button type="button" id="kb-hide" class="kb-icon" title="কীবোর্ড লুকান" aria-label="Hide keyboard"><i class="fa-solid fa-chevron-down"></i></button>
      </div>
      <div id="kb-tabs" class="ktabs" hidden></div>
      <div id="kb-body"></div>
    </div>
  </div>
  <button type="button" id="kb-open" hidden aria-label="Open keyboard"><i class="fa-regular fa-keyboard"></i></button>

  <!-- ===== JSON মোডাল ===== -->
  <div id="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="JSON">
      <header>
        <h2>JSON</h2>
        <button type="button" id="m-copy" class="hbtn"><i class="fa-regular fa-copy"></i> <span>Copy</span></button>
        <button type="button" id="m-download" class="hbtn"><i class="fa-solid fa-download"></i> Download</button>
        <button type="button" id="m-close" class="ibtn" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </header>
      <div class="body">
        <div id="m-msg"></div>
        <textarea id="json-out" spellcheck="false"></textarea>
        <div class="mt-3 flex items-center gap-2">
          <button type="button" id="m-load" class="hbtn"><i class="fa-solid fa-file-import"></i> Load into editor</button>
          <span class="font-english text-[12px] text-[#8a9bb4]">আগের কোনো JSON পেস্ট করে এডিট করতে চাইলে এটা চাপুন</span>
        </div>
        <p id="m-err" class="err" hidden></p>
      </div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    var LS_KEY = 'gbEditorDraft';
    var uid = 0;
    var state = { meta: { classNo: '9', chapterNo: '', chapterTitle: '', exercise: '' }, questions: [] };

    /* =================== ছোট সহায়ক =================== */
    function $(sel, root) { return (root || document).querySelector(sel); }
    function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
    function esc(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    function newLine(type) { return { id: ++uid, type: type || 'text', value: '', img: '', alt: '' }; }
    function nextNo() {
      var last = state.questions[state.questions.length - 1];
      if (last && /^\d+$/.test(String(last.no).trim())) return String(parseInt(last.no, 10) + 1);
      return String(state.questions.length + 1);
    }
    function newQuestion() {
      return { id: ++uid, no: nextNo(), part: '', question: '', expr: '', svg: '', lines: [newLine('text')] };
    }
    function qById(id) { for (var i = 0; i < state.questions.length; i++) if (String(state.questions[i].id) === String(id)) return state.questions[i]; return null; }
    function findLine(id) {
      for (var i = 0; i < state.questions.length; i++) {
        var q = state.questions[i];
        for (var j = 0; j < q.lines.length; j++) if (String(q.lines[j].id) === String(id)) return { q: q, line: q.lines[j], i: j };
      }
      return null;
    }

    var activeQid = null;
    var activeEl = null;

    /* =================== সেভ / লোড =================== */
    var saveTimer;
    function saveSoon() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () {
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
      }, 300);
    }
    function loadDraft() {
      try {
        var raw = localStorage.getItem(LS_KEY);
        if (!raw) return false;
        return adoptState(JSON.parse(raw));
      } catch (e) { return false; }
    }
    function adoptState(s) {
      if (!s || !s.meta || !Array.isArray(s.questions)) return false;
      state.meta = {
        classNo: String(s.meta.classNo == null ? '' : s.meta.classNo),
        chapterNo: String(s.meta.chapterNo == null ? '' : s.meta.chapterNo),
        chapterTitle: String(s.meta.chapterTitle || ''),
        exercise: String(s.meta.exercise || '')
      };
      state.questions = s.questions.map(function (q) {
        return {
          id: ++uid, no: String(q.no == null ? '' : q.no), part: String(q.part || ''), question: String(q.question || ''),
          expr: String(q.expr || ''), svg: String(q.svg || ''),
          lines: (q.lines || []).map(function (l) {
            return { id: ++uid, type: l.type || 'text', value: String(l.value || ''), img: String(l.img || ''), alt: String(l.alt || '') };
          })
        };
      });
      if (!state.questions.length) state.questions.push(newQuestion());
      return true;
    }

    /* =================== রেন্ডার =================== */
    function lineHtml(l, i) {
      var body;
      if (l.type === 'img') {
        body = '<div class="imgrow">' +
          '<input class="fld" data-lf="img" data-mode="native" autocomplete="off" placeholder="images/1-1/q3-i.png">' +
          '<input class="fld" data-lf="alt" data-mode="native" autocomplete="off" placeholder="ছবির বর্ণনা (alt)">' +
          '</div>';
      } else {
        var eq = l.type === 'eq';
        body = '<div class="field"><textarea class="fld kt' + (eq ? ' mono' : '') + '" inputmode="none" rows="1" data-lf="value" data-mode="' + l.type +
          '" placeholder="' + (eq ? 'সমীকরণ (শুধু LaTeX)' : 'উত্তরের লাইন লিখুন...') + '"></textarea><div class="prev"></div></div>';
      }
      function seg(t, label) { return '<button type="button" data-act="l-type" data-type="' + t + '" aria-pressed="' + (l.type === t) + '">' + label + '</button>'; }
      return '<div class="line" data-lid="' + l.id + '">' +
        '<div class="lhead"><span class="lnum">' + (i + 1) + '</span>' +
        '<div class="seg" role="group" aria-label="Line type">' + seg('text', 'Text') + seg('eq', 'Equation') + seg('img', 'Image') + '</div>' +
        '<span class="grow"></span>' +
        '<button type="button" class="ibtn" data-act="l-up" aria-label="Move up"><i class="fa-solid fa-arrow-up"></i></button>' +
        '<button type="button" class="ibtn" data-act="l-down" aria-label="Move down"><i class="fa-solid fa-arrow-down"></i></button>' +
        '<button type="button" class="ibtn del" data-act="l-del" aria-label="Delete line"><i class="fa-solid fa-trash-can"></i></button>' +
        '</div>' + body + '</div>';
    }

    function questionHtml(q, idx) {
      return '<section class="qcard' + (String(q.id) === String(activeQid) ? ' active' : '') + '" data-qid="' + q.id + '">' +
        '<div class="qhead">' +
          '<span class="qbadge">Q.<span data-badge>' + esc(q.no || (idx + 1)) + '</span></span>' +
          '<input class="fld sm kt" inputmode="none" data-f="no" data-mode="plain" autocomplete="off" placeholder="No.">' +
          '<input class="fld sm kt" inputmode="none" data-f="part" data-mode="plain" autocomplete="off" placeholder="Part (i)">' +
          '<span class="grow"></span>' +
          '<button type="button" class="ibtn" data-act="q-up" aria-label="Move question up"><i class="fa-solid fa-arrow-up"></i></button>' +
          '<button type="button" class="ibtn" data-act="q-down" aria-label="Move question down"><i class="fa-solid fa-arrow-down"></i></button>' +
          '<button type="button" class="ibtn del" data-act="q-del" aria-label="Delete question"><i class="fa-solid fa-trash-can"></i></button>' +
        '</div>' +
        '<label class="lbl">Question</label>' +
        '<div class="field"><textarea class="fld kt" inputmode="none" rows="2" data-f="question" data-mode="text" placeholder="প্রশ্ন লিখুন..."></textarea><div class="prev"></div></div>' +
        '<label class="lbl">Expression <i>(ঐচ্ছিক)</i></label>' +
        '<div class="field"><textarea class="fld kt mono" inputmode="none" rows="1" data-f="expr" data-mode="eq" placeholder="2x + 3 = 11"></textarea><div class="prev"></div></div>' +
        '<details class="more"><summary>SVG চিত্র (ঐচ্ছিক)</summary>' +
          '<textarea class="fld mono" rows="3" data-f="svg" data-mode="native" spellcheck="false" placeholder="&lt;svg viewBox=...&gt;...&lt;/svg&gt;"></textarea></details>' +
        '<div class="atitle">Answer</div>' +
        '<div class="lines">' + q.lines.map(lineHtml).join('') + '</div>' +
        '<button type="button" class="addline" data-act="add-line"><i class="fa-solid fa-plus"></i> New Answer</button>' +
      '</section>';
    }

    function autosize(t) {
      if (t.tagName !== 'TEXTAREA') return;
      t.style.height = 'auto';
      if (t.scrollHeight) t.style.height = t.scrollHeight + 2 + 'px';
    }

    var previewTimers = new WeakMap();
    function renderPreview(t) {
      var wrap = t.parentElement;
      var prev = wrap && wrap.querySelector('.prev');
      if (!prev) return;
      var v = t.value, html = '';
      if (v.trim()) {
        html = t.dataset.mode === 'eq'
          ? '$$' + esc(v) + '$$'

        var b = e.target.closest('.key[data-rep]');
        if (!b) return;
        e.preventDefault();
        runKey(b);
        stopRep();
        repTimer = setTimeout(function () { repInterval = setInterval(function () { runKey(b); }, 70); }, 420);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { kb.addEventListener(ev, stopRep); });

      kb.addEventListener('click', function (e) {
        var key = e.target.closest('.key');
        if (key) { if (!key.dataset.rep) runKey(key); return; }
        var sw = e.target.closest('[data-kb]');
        if (sw) { kbType = sw.dataset.kb; renderKeyboard(); return; }
        var tab = e.target.closest('[data-tab]');
        if (tab) { mathTab = tab.dataset.tab; renderKeyboard(); return; }
      });
      // কীবোর্ডের রেপিট-কী কীবোর্ড দিয়ে (Enter/Space) চাপলে
      kb.addEventListener('keydown', function (e) {
        var key = e.target.closest && e.target.closest('.key[data-rep]');
        if (key && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); runKey(key); }
      });

      $('#kb-hide').addEventListener('click', function () { kbManualHidden = true; showKb(false); });
      $('#kb-open').addEventListener('click', function () {
        kbManualHidden = false; showKb(true);
        if (activeEl && document.body.contains(activeEl)) activeEl.focus({ preventScroll: true });
      });
      $('#kb-sys').addEventListener('click', function () {
        sysKeyboard = !sysKeyboard;
        this.setAttribute('aria-pressed', sysKeyboard ? 'true' : 'false');
        $$('.kt').forEach(function (el) { el.setAttribute('inputmode', sysKeyboard ? 'text' : 'none'); });
        if (activeEl && document.body.contains(activeEl)) activeEl.focus({ preventScroll: true });
      });

      if (window.ResizeObserver) new ResizeObserver(syncPadding).observe(kb);
    }

    /* =================== JSON তৈরি ও যাচাই =================== */
    function numOrStr(v) {
      v = String(v == null ? '' : v).trim();
      return /^-?\d+$/.test(v) ? parseInt(v, 10) : v;
    }

    function buildJson() {
      var m = state.meta;
      var meta = { classNo: numOrStr(m.classNo), chapterNo: numOrStr(m.chapterNo), chapterTitle: String(m.chapterTitle).trim(), exercise: String(m.exercise).trim() };
      var questions = state.questions.map(function (q) {
        var o = {};
        if (String(q.no).trim()) o.no = String(q.no).trim();
        if (String(q.part).trim()) o.part = String(q.part).trim();
        if (String(q.svg).trim()) o.svg = String(q.svg).trim();
        o.question = String(q.question).trim();
        if (String(q.expr).trim()) o.expr = String(q.expr).trim();
        o.solution = [];
        q.lines.forEach(function (l) {
          if (l.type === 'img') {
            if (String(l.img).trim()) o.solution.push({ img: String(l.img).trim(), alt: String(l.alt).trim() || 'চিত্র' });
          } else if (String(l.value).trim()) {
            o.solution.push(l.type === 'eq' ? '$$' + String(l.value).trim() + '$$' : String(l.value).trim());
          }
        });
        return o;
      });
      return { meta: meta, questions: questions };
    }

    function lint(data) {
      var out = [];
      function checkText(label, text, isEq) {
        var dollars = 0;
        for (var i = 0; i < text.length; i++) {
          if (text.charAt(i) === '\\') { i++; continue; }
          if (text.charAt(i) === '$') dollars++;
        }
        if (!isEq && dollars % 2 !== 0) out.push(label + ': $ চিহ্ন জোড়ায় নেই');
        var open = 0, close = 0;
        for (var j = 0; j < text.length; j++) {
          if (text.charAt(j) === '\\') { j++; continue; }
          if (text.charAt(j) === '{') open++;
          if (text.charAt(j) === '}') close++;
        }
        if (open !== close) out.push(label + ': { } এর সংখ্যা মিলছে না');
      }
      if (!data.meta.exercise) out.push('Exercise নম্বর দেওয়া হয়নি (ফাইলের নাম হবে exercise.json)');
      data.questions.forEach(function (q, i) {
        var lab = 'প্রশ্ন ' + (q.no || (i + 1));
        if (!q.question) out.push(lab + ': প্রশ্নের লেখা ফাঁকা');
        if (!q.solution.length) out.push(lab + ': সমাধান ফাঁকা');
        if (q.question) checkText(lab + ' (প্রশ্ন)', q.question, false);
        if (q.expr) checkText(lab + ' (expression)', q.expr, true);
        q.solution.forEach(function (s, k) {
          if (typeof s === 'string') checkText(lab + ', উত্তরের লাইন ' + (k + 1), s, false);
        });
      });
      return out;
    }

    function openModal() {
      var data = buildJson();
      var warns = lint(data);
      $('#json-out').value = JSON.stringify(data, null, 2);
      var msg = $('#m-msg');
      msg.innerHTML = warns.length
        ? '<div class="warn"><b>একটু দেখে নিন:</b><br>' + warns.map(function (w) { return '• ' + esc(w); }).join('<br>') + '</div>'
        : '<div class="ok">কোনো সমস্যা পাওয়া যায়নি ✓</div>';
      $('#m-err').hidden = true;
      $('#modal').hidden = false;
      showKb(false);
    }
    function closeModal() {
      $('#modal').hidden = true;
      if (!kbManualHidden) showKb(true);
    }

    function copyText(text, done) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
      } else fallback();
      function fallback() {
        var ta = $('#json-out'); ta.focus(); ta.select();
        try { if (document.execCommand('copy')) done(); } catch (e) {}
      }
    }

    function bindModal() {
      $('#btn-json').addEventListener('click', openModal);
      $('#m-close').addEventListener('click', closeModal);
      $('#modal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

      $('#m-copy').addEventListener('click', function () {
        var label = $('span', this);
        copyText($('#json-out').value, function () {
          label.textContent = 'Copied ✓';
          setTimeout(function () { label.textContent = 'Copy'; }, 1500);
        });
      });

      $('#m-download').addEventListener('click', function () {
        var name = (String(state.meta.exercise).trim() || 'exercise') + '.json';
        var blob = new Blob([$('#json-out').value], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      });

      $('#m-load').addEventListener('click', function () {
        var err = $('#m-err');
        try {
          var data = JSON.parse($('#json-out').value);
          if (!data || !Array.isArray(data.questions)) throw new Error('"questions" নামে তালিকা নেই');
          var lines = function (sol) {
            return (sol || []).map(function (it) {
              if (typeof it === 'string') {
                var dm = it.match(/^\$\$([\s\S]*)\$\$$/);
                return dm && it.indexOf('$$', 2) === it.length - 2 && it.slice(2, -2).indexOf('$$') < 0
                  ? { type: 'eq', value: dm[1].trim() } : { type: 'text', value: it };
              }
              if (it && it.img) return { type: 'img', img: it.img, alt: it.alt || '' };
              return null;
            }).filter(Boolean);
          };
          adoptState({
            meta: data.meta || {},
            questions: data.questions.map(function (q) {
              return { no: q.no, part: q.part, question: q.question, expr: q.expr, svg: q.svg, lines: lines(q.solution) };
            })
          });
          setMetaFields(); activeQid = null; render(); saveSoon();
          err.hidden = true; closeModal();
        } catch (e) {
          err.textContent = 'JSON পড়া যায়নি: ' + e.message;
          err.hidden = false;
        }
      });
    }

    /* =================== শুরু =================== */
    function init() {
      if (!loadDraft()) state.questions.push(newQuestion());
      activeQid = state.questions[state.questions.length - 1].id;
      setMetaFields();
      render();

      var qs = $('#questions');
      qs.addEventListener('input', onInput);
      qs.addEventListener('click', onClick);
      qs.addEventListener('focusin', onFocusIn);
      var meta = $('#meta');
      meta.addEventListener('input', onInput);
      meta.addEventListener('focusin', onFocusIn);

      $('#btn-new-q').addEventListener('click', addQuestion);
      $('#btn-new-a').addEventListener('click', addAnswer);
      $('#btn-reset').addEventListener('click', function () {
        if (!window.confirm('সব মুছে নতুন করে শুরু করবেন?')) return;
        state.meta = { classNo: '9', chapterNo: '', chapterTitle: '', exercise: '' };
        state.questions = [newQuestion()];
        activeQid = state.questions[0].id;
        setMetaFields(); render(); saveSoon();
      });

      bindKeyboard();
      bindModal();
      renderKeyboard();
    }

    // পরীক্ষার জন্য (ব্যবহারে কোনো প্রভাব নেই)
    window.__editor = { state: state, buildJson: buildJson, mathStateAt: mathStateAt };

    init();
  })();
  </script>
</body>
