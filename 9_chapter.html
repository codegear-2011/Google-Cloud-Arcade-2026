<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f9ff">
  <title>অধ্যায় নির্বাচন — গণিত বন্ধু</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            bengali: ['Tiro Bangla', 'serif'],
            english: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: "Tiro Bangla", serif; }
    .app-shell { max-width: 520px; }

    .chapter-card { transition: transform .2s ease, box-shadow .2s ease; }
    .chapter-card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(30, 64, 110, .09); }
    .chapter-card:active { transform: scale(.985); }

    button:focus-visible, input:focus-visible {
      outline: 3px solid #3989e9;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>

<body class="min-h-screen bg-[#fbfcff] text-[#123d7d]">

  <main class="app-shell relative mx-auto min-h-screen bg-[#f7faff] px-4 pb-10 shadow-[0_0_55px_rgba(36,69,112,0.05)] sm:px-5">

    <!-- ===== Header ===== -->
    <header class="flex items-center gap-3 pt-6">
      <button type="button" onclick="history.back()" aria-label="পেছনে যান"
        class="h-10 w-8 shrink-0 text-[#1554a4] transition hover:text-blue-600">
        <i class="fa-solid fa-arrow-left text-[24px]"></i>
      </button>

      <img
        src="https://www.appcreator24.com/srv/imgs/gen/4227302_icohome.png?ts=1792924059"
        alt="গণিত বন্ধু অ্যাপ আইকন"
        class="h-[60px] w-[60px] shrink-0 rounded-[18px] object-cover shadow-sm">

      <div class="min-w-0 flex-1">
        <h1 class="text-[24px] leading-tight text-[#1554a4]">গণিত বন্ধু</h1>
        <p class="font-english text-[12px] leading-snug text-[#637895]">WBBSE Math Solutions</p>
      </div>

      <button type="button" aria-label="বুকমার্ক" class="h-10 w-9 shrink-0 text-[#234a80] transition hover:text-blue-600">
        <i class="fa-regular fa-bookmark text-[22px]"></i>
      </button>
      <button type="button" aria-label="আরও" class="h-10 w-7 shrink-0 text-[#234a80] transition hover:text-blue-600">
        <i class="fa-solid fa-ellipsis-vertical text-[20px]"></i>
      </button>
    </header>

    <!-- ===== Banner ===== -->
    <section class="relative mt-5 overflow-hidden rounded-[22px] bg-gradient-to-br from-[#e9f2ff] to-[#dfeafc] p-5">

      <div class="relative z-10 max-w-[62%]">
        <span class="inline-flex items-center gap-2 rounded-full bg-[#1565c9] px-4 py-1.5 font-english text-[15px] font-medium text-white">
          <i class="fa-solid fa-graduation-cap text-[15px]"></i>
          Class <span id="class-number">9</span>
        </span>

        <h2 class="mt-4 text-[30px] leading-tight text-[#0f3d8a]">অধ্যায় নির্বাচন</h2>
        <p class="mt-2 text-[15px] leading-[1.6] text-[#637895]">
          নিচের তালিকা থেকে আপনার পছন্দের অধ্যায়টি নির্বাচন করুন।
        </p>
      </div>

      <!-- Decorations -->
      <span class="absolute right-6 top-3 -rotate-12 font-english text-[17px] italic text-[#a9c8f5]">a² + b² = c²</span>
      <i class="fa-solid fa-play absolute right-4 top-[62px] -rotate-90 text-[34px] text-[#c4dafa] opacity-70"></i>
      <i class="fa-solid fa-leaf absolute bottom-6 right-[44%] text-[22px] text-[#bcd5f7]"></i>
      <i class="fa-solid fa-leaf absolute bottom-6 right-3 text-[22px] text-[#bcd5f7]"></i>

      <!-- Books illustration -->
      <svg class="absolute bottom-2 right-3 h-[125px] w-[170px]" viewBox="0 0 200 150" aria-hidden="true">
        <g transform="translate(0 14) skewY(-6)">
          <!-- yellow book -->
          <rect x="22" y="108" width="150" height="18" rx="4" fill="#ffb92e"/>
          <rect x="30" y="126" width="142" height="9" rx="2" fill="#ffffff" stroke="#f2d28b" stroke-width="2"/>
          <!-- blue book -->
          <rect x="34" y="80" width="136" height="18" rx="4" fill="#0f5ec9"/>
          <rect x="42" y="98" width="128" height="9" rx="2" fill="#ffffff" stroke="#c7dcf7" stroke-width="2"/>
          <!-- pencils -->
          <line x1="98" y1="46" x2="94" y2="14" stroke="#ffb92e" stroke-width="9" stroke-linecap="round"/>
          <line x1="118" y1="46" x2="126" y2="14" stroke="#1565c9" stroke-width="9" stroke-linecap="round"/>
          <!-- cup -->
          <path d="M86 44 H134 L130 80 H90 Z" fill="#0b428b"/>
          <rect x="82" y="40" width="56" height="9" rx="3" fill="#0b428b"/>
        </g>
      </svg>
    </section>

    <!-- ===== Search ===== -->
    <div class="relative mt-5">
      <label for="chapter-search" class="sr-only">অধ্যায় খুঁজুন</label>
      <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-5 top-1/2 -translate-y-1/2 text-[19px] text-[#5d6f8c]"></i>
      <input id="chapter-search" type="search" autocomplete="off" placeholder="অধ্যায় খুঁজুন..."
        class="h-[54px] w-full rounded-full border-2 border-[#e1ebf9] bg-[#f1f6fe] pl-14 pr-5 text-[17px] text-[#123d7d] placeholder:text-[#8a9bb4]">
    </div>

    <!-- ===== Chapter list ===== -->
    <section id="chapter-list" aria-label="অধ্যায় তালিকা" class="mt-5 space-y-3"></section>

    <p id="empty-message" class="hidden py-10 text-center text-[17px] text-[#637895]">কোনো অধ্যায় পাওয়া যায়নি।</p>

  </main>

  <script>
    // শ্রেণী: আগের পেজে নির্বাচিত মান, না থাকলে ৯
    let savedClass = '9';
    try {
      savedClass = localStorage.getItem('ganitBondhuSelectedClass') || '9';
    } catch (e) {}
    document.getElementById('class-number').textContent = savedClass;

    // রঙের সেট
    const colors = {
      blue:   { bg: 'bg-[#dbeafe]', text: 'text-[#1765c4]' },
      green:  { bg: 'bg-[#d6f5e4]', text: 'text-[#168357]' },
      purple: { bg: 'bg-[#e9e2ff]', text: 'text-[#6242c5]' },
      orange: { bg: 'bg-[#ffe6c4]', text: 'text-[#c76a0a]' },
      teal:   { bg: 'bg-[#cdf3f3]', text: 'text-[#0a8a94]' },
      pink:   { bg: 'bg-[#ffdce3]', text: 'text-[#cf2d52]' }
    };

    // অধ্যায়ের তালিকা — নতুন অধ্যায় যোগ করতে এখানে লাইন বাড়ান
    const chapters = [
      { no: 1, title: 'বাস্তব সংখ্যা',   desc: 'বাস্তব সংখ্যা ও তাদের বৈশিষ্ট্য',        color: 'blue'   },
      { no: 2, title: 'সরল সমীকরণ',     desc: 'সরল সমীকরণ এবং তার সমাধান',            color: 'green'  },
      { no: 3, title: 'দ্বিঘাত সমীকরণ',  desc: 'দ্বিঘাত সমীকরণ ও তার সমাধান',           color: 'purple' },
      { no: 4, title: 'সূচক ও লগারিদম',  desc: 'সূচক ও লগারিদমের ধারণা ও প্রয়োগ',       color: 'orange' },
      { no: 5, title: 'ত্রিকোণমিতি',     desc: 'ত্রিকোণমিতির মৌলিক ধারণা',               color: 'teal'   },
      { no: 6, title: 'জ্যামিতি',        desc: 'রেখা, কোণ, ত্রিভুজ এবং চতুর্ভুজ',         color: 'pink'   }
    ];

    const list = document.getElementById('chapter-list');
    const emptyMessage = document.getElementById('empty-message');
    const searchInput = document.getElementById('chapter-search');

    function renderChapters(items) {
      list.innerHTML = items.map(function (c) {
        const col = colors[c.color];
        return `
          <button type="button" onclick="openChapter(${c.no})"
            class="chapter-card flex w-full items-center gap-4 rounded-[20px] border border-[#e8eff9] bg-white px-4 py-4 text-left shadow-[0_2px_10px_rgba(30,64,110,0.04)]">
            <div class="flex h-[68px] w-[68px] shrink-0 flex-col items-center justify-center rounded-full ${col.bg} ${col.text}">
              <span class="text-[12px] leading-none">অধ্যায়</span>
              <span class="mt-1 font-english text-[26px] font-semibold leading-none">${c.no}</span>
            </div>
            <div class="min-w-0 flex-1">
              <h3 class="text-[20px] leading-snug text-[#0f3d8a]">${c.title}</h3>
              <p class="mt-1 text-[15px] leading-snug text-[#637895]">${c.desc}</p>
            </div>
            <i class="fa-solid fa-chevron-right pr-1 text-[18px] text-[#1565c9]"></i>
          </button>`;
      }).join('');
      emptyMessage.classList.toggle('hidden', items.length > 0);
    }

    searchInput.addEventListener('input', function () {
      const q = searchInput.value.trim().toLowerCase();
      renderChapters(chapters.filter(function (c) {
        return (c.title + ' ' + c.desc + ' ' + c.no).toLowerCase().includes(q);
      }));
    });

    function openChapter(no) {
      try {
        localStorage.setItem('ganitBondhuSelectedChapter', String(no));
      } catch (e) {}
      // পরবর্তী পেজ যুক্ত করলে এখানে navigation যোগ করুন।
      // উদাহরণ: window.location.href = 'chapter.html?no=' + no;
    }

    renderChapters(chapters);
  </script>

</body>

</html>
